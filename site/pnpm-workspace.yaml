engineStrict: true

# Supply-chain cooldown: refuse to resolve any package version (direct or
# transitive) published less than 5 days ago. Closes the lockFileMaintenance
# gap that Renovate's minimumReleaseAge cannot enforce for pnpm. Setting it
# explicitly makes pnpm fail rather than fall back to an older version.
minimumReleaseAge: 7200

# Supply-chain trust policy: block packages whose trust level dropped vs an
# earlier release (provenance downgrade / possible takeover).
trustPolicy: no-downgrade

# Fail the install on an unmet peer instead of resolving one silently. pnpm only
# evaluates peers when it RESOLVES, so a routine --frozen-lockfile install pays
# nothing; this fires where the decision is made, including when Renovate
# regenerates a lockfile. Mirrors web/ and studio/ (withotto.app doesn't set it).
strictPeerDependencies: true

# Explicit per-package build-script approval: true runs the package's
# install/build script.
allowBuilds:
  esbuild: true
  sharp: true
