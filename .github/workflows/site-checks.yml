# Checks site/ (v2 of the website) on every PR and every push to main that
# changes it: the check-script, site and function tests, astro check, lint,
# format, the build, then the SEO, accessibility and link checks against that
# build. `pnpm check` (site/scripts/checks/all.mjs) runs the same steps
# locally; keep the two in step. Adapted from withotto.app's checks.yml.
#
# Deliberately unprivileged: triggered by pull_request (never
# pull_request_target), a read-only token, no secrets, and checkout
# credentials not persisted. SEO and accessibility findings land in the job
# summary and in the `site-checks-report` artifact, readable with
# `gh run view` / `gh run download`. Link check (lychee) findings are in its
# step's log (`gh run view --log-failed`).
#
# The paths filter means this workflow reports nothing on PRs that don't touch
# site/, so it can't be a required check as it stands.
name: site-checks

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-checks.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site-checks.yml"

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  checks:
    # GitHub-hosted rather than withotto.app's Blacksmith runners: this repo is
    # public, so these are free, and the org has no Blacksmith installation.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # Pinned so a mise release can't silently change tool resolution
          # between runs.
          version: 2026.9.14
          working_directory: site
          install_args: node pnpm lychee

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Test the check scripts
        run: pnpm test:checks

      - name: Test the site's code
        run: pnpm test:site

      - name: Test the functions
        run: pnpm test:functions

      - name: Check types
        run: pnpm check:types

      - name: Lint
        run: pnpm lint:check

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        id: build
        run: pnpm build

      # Each check runs even when an earlier one fails, so one run reports
      # everything.
      - name: SEO check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:seo

      - name: Accessibility check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:a11y

      - name: Link check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm check:links

      - name: Upload the reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-checks-report
          path: site/.checks/*.json
          # .checks/ is a dot-directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
