# Keep packageManager as bare semver (no Corepack +sha512 hash) so Corepack and
# Renovate's bare-semver customManager can both parse it. Mirrors web/pnpm-workspace.yaml.
manage-package-manager-versions: false

# Fail the install on an unmet peer instead of resolving one silently. pnpm only
# evaluates peers when it RESOLVES, so this costs a routine --frozen-lockfile
# install nothing; it fires where the decision is actually made, including when
# Renovate regenerates a lockfile. Without it, studio ran for two months on a
# TypeScript outside typescript-eslint's declared range and nothing reported it,
# because the linter that would have loaded typescript-eslint was itself dead.
# This is also what keeps TypeScript 7 out without a Renovate hold rule to rot:
# the bump simply fails to resolve until typescript-eslint supports it, then
# starts working on its own.
strictPeerDependencies: true

# pnpm 11 requires explicit per-package build-script approval (strictDepBuilds is
# on by default; an unhandled build script fails install with ERR_PNPM_IGNORED_BUILDS).
# Sanity bundles esbuild and needs its native binary at build time.
allowBuilds:
  esbuild: true

# pnpm 11's supply-chain check (trustPolicy) flags these mainstream transitive
# deps as "trust downgrade" false positives, which fails `pnpm install`. Excluded
# surgically so the verification stays ON for every other package. Revisit if
# pnpm's heuristic improves or these clear upstream.
trustPolicyExclude:
  - '@portabletext/editor'
  - '@reduxjs/toolkit'
  - '@sanity/template-validator'
  - groq
  - react-redux
  - reselect
  - sanity-plugin-utils
  - semver
  - undici-types
